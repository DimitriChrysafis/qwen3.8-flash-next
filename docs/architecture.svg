<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Colibri runtime architecture</title>
  <desc id="desc">The MLX model routes tokens to asynchronous expert and n-gram storage backed by safetensors on SSD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17263c"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #b6c5d9; }
      .label { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f8fafc; }
      .body { font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #dbeafe; }
      .small { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #a9bdd6; }
      .tag { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #cffafe; letter-spacing: 1.3px; }
      .line { fill: none; stroke: #93c5fd; stroke-width: 3; marker-end: url(#arrow); }
      .lineCyan { fill: none; stroke: #67e8f9; stroke-width: 3; marker-end: url(#arrowCyan); }
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="1260" cy="110" r="220" fill="#2563eb" opacity=".08"/>
  <circle cx="90" cy="730" r="250" fill="#06b6d4" opacity=".06"/>

  <text x="72" y="76" class="title">colibri runtime</text>
  <text x="72" y="108" class="subtitle">disk-streamed sparse inference on apple silicon</text>

  <g filter="url(#shadow)">
    <rect x="72" y="300" width="190" height="150" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="300" y="190" width="360" height="370" rx="24" fill="url(#model)"/>
    <rect x="716" y="144" width="320" height="462" rx="24" fill="url(#stream)"/>
    <rect x="1092" y="238" width="236" height="278" rx="24" fill="url(#disk)"/>
  </g>

  <text x="98" y="336" class="tag">INPUT</text>
  <text x="98" y="373" class="label">token ids</text>
  <text x="98" y="405" class="body">prompt + cache state</text>
  <text x="98" y="430" class="small">int32 sequence</text>

  <text x="330" y="230" class="tag">MLX MODEL</text>
  <text x="330" y="272" class="label">qwen4exp</text>
  <text x="330" y="305" class="body">gated residual blocks</text>
  <text x="330" y="332" class="body">linear + full attention</text>
  <line x1="330" y1="358" x2="630" y2="358" stroke="#bfdbfe" opacity=".35"/>
  <text x="330" y="395" class="tag">ROUTING</text>
  <text x="330" y="428" class="body">bf16 router → top-k experts</text>
  <text x="330" y="478" class="tag">PLE</text>
  <text x="330" y="511" class="body">n-gram ids → selected rows</text>

  <text x="746" y="184" class="tag">STREAMING PLANE</text>
  <text x="746" y="226" class="label">async stores</text>
  <rect x="746" y="262" width="260" height="82" rx="14" fill="#082f49" stroke="#67e8f9" stroke-opacity=".6"/>
  <text x="770" y="295" class="body">expert cache</text>
  <text x="770" y="321" class="small">adaptive, byte-bounded</text>
  <rect x="746" y="366" width="260" height="82" rx="14" fill="#082f49" stroke="#67e8f9" stroke-opacity=".6"/>
  <text x="770" y="399" class="body">prefetch + futures</text>
  <text x="770" y="425" class="small">overlap reads with compute</text>
  <rect x="746" y="470" width="260" height="82" rx="14" fill="#082f49" stroke="#67e8f9" stroke-opacity=".6"/>
  <text x="770" y="503" class="body">dequantize + matmul</text>
  <text x="770" y="529" class="small">4-bit weights on Metal</text>

  <text x="1118" y="278" class="tag">PERSISTENT DATA</text>
  <text x="1118" y="319" class="label">safetensors</text>
  <text x="1118" y="352" class="body">SSD-backed weights</text>
  <text x="1118" y="386" class="small">selected expert slices</text>
  <text x="1118" y="411" class="small">selected n-gram rows</text>
  <line x1="1118" y1="438" x2="1300" y2="438" stroke="#cbd5e1" opacity=".3"/>
  <text x="1118" y="474" class="small">only requested bytes move</text>

  <path d="M262 375H300" class="line"/>
  <path d="M660 375H716" class="lineCyan"/>
  <path d="M1036 375H1092" class="lineCyan"/>
  <path d="M876 606V666H520V560" class="line"/>
  <text x="880" y="644" class="small">materialized slices return to the model</text>

  <g>
    <rect x="72" y="660" width="1210" height="82" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="98" y="696" class="tag">OUTPUT</text>
    <text x="98" y="724" class="body">logits → sampler → next token</text>
    <text x="520" y="696" class="tag">OBSERVABILITY</text>
    <text x="520" y="724" class="body">rss • mlx memory • routes • cache hits • bytes • i/o wait</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Colibri token inference loop</title>
  <desc id="desc">Each token is routed, prefetched, loaded, computed, and fed back into the recurrent cache.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#201b3b"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c4b5fd"/>
    </marker>
    <marker id="arrowHot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5eead4"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c4b5fd; }
      .num { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #ddd6fe; }
      .label { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f8fafc; }
      .body { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #e9d5ff; }
      .small { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c4b5fd; }
      .line { fill: none; stroke: #c4b5fd; stroke-width: 3; marker-end: url(#arrow); }
      .lineHot { fill: none; stroke: #5eead4; stroke-width: 3; marker-end: url(#arrowHot); }
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" class="title">one token, one streaming loop</text>
  <text x="72" y="108" class="subtitle">the hot path keeps compute moving while storage works ahead</text>

  <g filter="url(#shadow)">
    <rect x="72" y="210" width="220" height="170" rx="20" fill="url(#step)"/>
    <rect x="350" y="210" width="220" height="170" rx="20" fill="url(#step)"/>
    <rect x="628" y="210" width="220" height="170" rx="20" fill="url(#hot)"/>
    <rect x="906" y="210" width="220" height="170" rx="20" fill="url(#hot)"/>
    <rect x="1184" y="210" width="144" height="170" rx="20" fill="#334155"/>
  </g>

  <circle cx="106" cy="246" r="20" fill="#7c3aed"/>
  <text x="100" y="252" class="num">01</text>
  <text x="100" y="300" class="label">route</text>
  <text x="100" y="330" class="body">bf16 gate selects</text>
  <text x="100" y="353" class="body">top-k experts</text>

  <circle cx="384" cy="246" r="20" fill="#7c3aed"/>
  <text x="378" y="252" class="num">02</text>
  <text x="378" y="300" class="label">prepare</text>
  <text x="378" y="330" class="body">deduplicate ids</text>
  <text x="378" y="353" class="body">submit grouped reads</text>

  <circle cx="662" cy="246" r="20" fill="#0d9488"/>
  <text x="656" y="252" class="num">03</text>
  <text x="656" y="300" class="label">fetch</text>
  <text x="656" y="330" class="body">C reader pulls</text>
  <text x="656" y="353" class="body">contiguous ranges</text>

  <circle cx="940" cy="246" r="20" fill="#0d9488"/>
  <text x="934" y="252" class="num">04</text>
  <text x="934" y="300" class="label">compute</text>
  <text x="934" y="330" class="body">dequantize +</text>
  <text x="934" y="353" class="body">Metal matmul</text>

  <circle cx="1208" cy="246" r="20" fill="#475569"/>
  <text x="1202" y="252" class="num">05</text>
  <text x="1202" y="300" class="label">emit</text>
  <text x="1202" y="330" class="body">next</text>
  <text x="1202" y="353" class="body">logit</text>

  <path d="M292 295H350" class="line"/>
  <path d="M570 295H628" class="lineHot"/>
  <path d="M848 295H906" class="lineHot"/>
  <path d="M1126 295H1184" class="line"/>

  <path d="M1255 380V492H180V380" class="line"/>
  <text x="584" y="478" class="small">append token to recurrent and attention cache</text>

  <g>
    <rect x="72" y="560" width="1256" height="102" rx="20" fill="#0f172a" stroke="#475569"/>
    <text x="100" y="596" class="label">in parallel</text>
    <text x="100" y="626" class="body">PLE predicts n-gram rows</text>
    <text x="472" y="626" class="body">expert transitions predict the next cache fill</text>
    <text x="1015" y="626" class="body">metrics record every byte and wait</text>
  </g>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38next-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlx>=0.32.0",
  "mlx-lm>=0.31.0",
  "numpy>=1.26",
  "psutil>=5.9",
  "safetensors>=0.4",
]

[project.optional-dependencies]
validation = ["torch==2.13.0", "transformers==5.16.1"]

[project.scripts]
colibri-qwen = "colibri_runtime.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
